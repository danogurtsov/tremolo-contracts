[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"
evm_version = "cancun"

optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"          # deterministic bytecode, cleaner verification (morpho-blue)
via_ir = false                  # off locally only: see ADR-0010. Every profile that produces
                                # deployable bytecode turns it on, because it is both smaller
                                # and cheaper - it costs 5x compile time, which only the local
                                # edit-test loop cares about.

gas_reports = ["*"]
fs_permissions = [
    { access = "read", path = "./test/fixtures" },
    { access = "read-write", path = "../ops" },
]

# ------------------------------------------------------------------
# Fuzz. Fixed seed so a failure reproduces instead of being caught once and lost.
# (pattern: euler-vault-kit)
# ------------------------------------------------------------------
[profile.default.fuzz]
runs = 512
seed = "0x7265616c697a6564766f6c"
max_test_rejects = 1_000_000

# ------------------------------------------------------------------
# Invariants. fail_on_revert = true is mandatory: without it handlers pass by reverting
# and the suite silently checks nothing (pattern: morpho-blue)
# ------------------------------------------------------------------
[profile.default.invariant]
runs = 192
depth = 128   # a full series lifecycle spans hours of simulated time; at depth 64 most runs
              # never reached settlement and the suite was green without proving anything
fail_on_revert = true
shrink_run_limit = 5_000

# ------------------------------------------------------------------
# Profiles for different run lengths (pattern: v4-core)
#   forge test                     - fast local cycle
#   FOUNDRY_PROFILE=pr forge test  - before pushing
#   FOUNDRY_PROFILE=ci forge test  - in CI, long run
# ------------------------------------------------------------------
# Pre-push: same bytecode that gets deployed, so a via_ir-only difference cannot reach main.
[profile.pr]
via_ir = true

[profile.pr.fuzz]
runs = 5_000

[profile.pr.invariant]
runs = 512
depth = 128
fail_on_revert = true

[profile.ci]
via_ir = true

[profile.ci.fuzz]
runs = 50_000

[profile.ci.invariant]
runs = 1_024
depth = 256
fail_on_revert = true

[profile.debug]
optimizer = false
via_ir = false

[profile.debug.fuzz]
runs = 32

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true

# Public archive endpoints, so fork tests and dry runs work with no configuration.
# Foundry does not expand ${VAR:-default} here, so these are written out; point --rpc-url at a
# private node to override. (The earlier ${BASE_RPC_URL:-...} form silently failed for scripts.)
[rpc_endpoints]
base = "https://mainnet.base.org"
arbitrum = "https://arb1.arbitrum.io/rpc"
mainnet = "https://eth.llamarpc.com"

[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
