name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: ci

jobs:
  build-and-test:
    name: build, test, invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show versions
        run: forge --version

      - name: Build
        run: forge build --sizes

      - name: Check formatting
        run: forge fmt --check

      # The differential suite is only meaningful if the fixtures match the reference that
      # generated them. Regenerating here means a silent edit to either side fails CI.
      - name: Regenerate reference fixtures
        run: |
          python3 reference/variance_reference.py
          git diff --exit-code test/fixtures/

      - name: Tests, fuzz and invariants
        run: forge test -vv

      # Proves the deployment path still works against a live chain's state, which no unit
      # test covers: constructor ordering, guardian wiring, and whether the target pool can
      # actually support the series the script opens.
      - name: Deployment dry run
        run: forge script script/Deploy.s.sol --fork-url base

      # Bytecode has to fit, and the number that matters is the one from the profile that
      # actually deploys. Checked explicitly because `--sizes` only warns, it does not fail.
      - name: Contract sizes
        run: forge build --sizes

      # Gas regressions are silent otherwise. Run under the default profile, which is what the
      # committed snapshot was taken with - the ci profile's fuzz counts would not match.
      - name: Gas snapshot
        run: FOUNDRY_PROFILE=default forge snapshot --check --no-match-path "test/fork/*"

  verification:
    name: symbolic proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install halmos
        run: pip install halmos
      # Only the properties that discharge; the four that do not are documented in
      # docs/measurements/formal_verification.md rather than reported as passing.
      - name: Prove core arithmetic
        run: halmos --match-contract VarianceMathSymbolicTest --solver-timeout-assertion 60000

  static-analysis:
    name: slither
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: crytic/slither-action@v0.4.0
        with:
          fail-on: high
